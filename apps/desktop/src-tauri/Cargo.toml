[package]
name = "desktop"
version = "0.4.4"
description = "Photopipe desktop app — photoshoot pipeline organizer"
authors = ["Raphael Mitas"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Apple forbids an App Store app that updates itself, so that build turns this
# off and the plugin, its menu item and its capability all drop out.
[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSData",
  "NSError",
  "NSString",
  "NSURL",
] }

