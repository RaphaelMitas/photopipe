services:
  photopipe:
    build: .
    container_name: photopipe
    # No built-in auth — expose only on a trusted network or behind a proxy.
    ports:
      - '3000:3000'
    volumes:
      # The shoot folders. Share this same directory over SMB/NFS to browse
      # and edit the files from other machines.
      - ./data/camera:/data/camera
      # The SQLite index. Disposable: delete it and it rebuilds on boot.
      - ./data/index:/data/index
    environment:
      - CAMERA_BASE=/data/camera
      - CAMERA_HOST_BASE=./data/camera
      - PHOTOPIPE_DB=/data/index/index.db
    restart: unless-stopped
