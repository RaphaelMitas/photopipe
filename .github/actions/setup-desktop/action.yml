name: Set up the desktop build
description: pnpm, Node, Rust with its cache, the vendored exiftool cache and node_modules.

inputs:
  components:
    description: Extra rustup components, comma separated
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: pnpm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: apps/desktop/src-tauri
    - name: Cache vendored exiftool
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: apps/desktop/src-tauri/resources/exiftool
        key: exiftool-${{ hashFiles('scripts/fetch-exiftool.sh') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
