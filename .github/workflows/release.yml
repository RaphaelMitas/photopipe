name: Release

# Every push to main asks whether the version in tauri.conf.json already has
# a tag. When it does not, a release PR from `pnpm release` just landed, so
# this tags the commit and ships it. workflow_dispatch re-runs the release for
# the current version even if the tag exists, for retrying a failed run.
# Every release also uploads the Mac and iPad App Store builds and submits
# them for review with automatic release. With submit_to_app_store it skips the
# DMG release and redoes only the store half, from the already tagged commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit_to_app_store:
        description: Upload the Mac and iPad App Store builds to App Store Connect and TestFlight
        type: boolean
        default: false
      # Redoing one store's submission must not pull the other's out of review.
      platform:
        description: Which store submit_to_app_store redoes
        type: choice
        options: [both, mac, ipad]
        default: both

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this a release?
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.decide.outputs.is-release }}
      submit: ${{ steps.decide.outputs.submit }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      tag-exists: ${{ steps.decide.outputs.tag-exists }}
      ref: ${{ steps.decide.outputs.ref }}
      # A job-level `if:` cannot read `secrets`, but an output can.
      mas: ${{ secrets.MAS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare the app version against existing tags
        id: decide
        env:
          MAS_CONFIGURED: ${{ secrets.MAS_CERTIFICATE != '' }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "tag-exists=$EXISTS" >> $GITHUB_OUTPUT

          if [ "${{ inputs.submit_to_app_store }}" = true ]; then
            if [ "$EXISTS" != true ]; then
              echo "::error::$TAG is not released yet. Release it first, then submit it to the App Store."
              exit 1
            fi
            if [ "$MAS_CONFIGURED" != true ]; then
              echo "::error::MAS_CERTIFICATE is not set; there is nothing to submit with."
              exit 1
            fi
            echo "Submitting $TAG to the App Store; the DMG release is not rebuilt."
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "submit=true" >> $GITHUB_OUTPUT
            echo "ref=$TAG" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
            if [ "$EXISTS" = true ]; then
              # Retry of a release that already tagged: rebuild exactly what
              # that tag points at. Building main instead would ship different
              # code under a version someone may already have installed.
              echo "Retrying $TAG; building the tagged commit."
              echo "ref=$TAG" >> $GITHUB_OUTPUT
            else
              echo "Manual release of $TAG from this commit."
              echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
            fi
          elif [ "$EXISTS" = true ]; then
            echo "$TAG already exists; this push is not a release."
            echo "is-release=false" >> $GITHUB_OUTPUT
          else
            echo "$TAG is new; releasing."
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  release:
    name: Build, sign, notarize
    needs: check
    if: needs.check.outputs.is-release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # Job-level so the tap step can guard on it: neither `secrets` nor a
      # step's own `env` are readable from a step-level `if`.
      TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
      APP: apps/desktop/src-tauri/target/release/bundle/macos/Photopipe.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      # Tag the commit being built, so the release points at exactly what
      # shipped. Never forced: once a version is tagged that tag is what
      # v<version> means, and a retry rebuilds it rather than moving it.
      # Pushed with GITHUB_TOKEN, which deliberately does not re-trigger.
      - name: Tag the release
        if: needs.check.outputs.tag-exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

      # Tags cut before #193 lack setup-desktop and import-cert.sh, so take them from this workflow's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: |
            .github/actions
            scripts
      - uses: ./.ci/.github/actions/setup-desktop

      # Only the .app here. The DMG is built after notarization, because a
      # DMG made now would wrap an unsigned app and be thrown away.
      - name: Build the app
        run: pnpm --filter desktop tauri build --bundles app

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not set. See docs/engineering.md for the eight release secrets."
              exit 1
            fi
          done
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          CERTIFICATE="$APPLE_CERTIFICATE" CERTIFICATE_PASSWORD="$APPLE_CERTIFICATE_PASSWORD" \
            ./.ci/scripts/import-cert.sh "$KEYCHAIN_PATH" /usr/bin/codesign

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      # exiftool needs no signature of its own: it is a Perl script, not a
      # Mach-O, and the app's seal covers it as a resource.
      - name: Sign
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Photopipe.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Photopipe.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"

      # Built from the stapled app, so the DMG carries a ticket even offline.
      - name: Build the DMG
        id: dmg
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          DMG="$RUNNER_TEMP/Photopipe-$VERSION.dmg"
          STAGE="$RUNNER_TEMP/dmg-root"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Photopipe -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "PATH=$DMG" >> $GITHUB_OUTPUT

      # The DMG is its own distributable and needs its own ticket, or the
      # first open still shows a Gatekeeper warning on a machine that has
      # never seen the app.
      - name: Sign and notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="${{ steps.dmg.outputs.PATH }}"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          # What a user's Mac will conclude before it opens the thing.
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      # The Homebrew tap's update-cask workflow fetches
      # `<repo>-<version>.zip`, so the cask asset has to carry that exact
      # name. It wraps the stapled app, so it is notarized by construction.
      - name: Zip the app for the cask
        id: zip
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ZIP="$RUNNER_TEMP/photopipe-$VERSION.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "PATH=$ZIP" >> $GITHUB_OUTPUT

      - name: Build and sign the updater archive
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          TARBALL="$RUNNER_TEMP/Photopipe-$VERSION.app.tar.gz"
          tar --no-mac-metadata -C "$(dirname "$APP")" -czf "$TARBALL" \
            "$(basename "$APP")"
          pnpm --filter desktop tauri signer sign "$TARBALL"

          SIG=$(cat "$TARBALL.sig") python3 <<'PY'
          import base64, json, os, sys

          def key_id(box):
              line = base64.b64decode(box).decode().splitlines()[1]
              return base64.b64decode(line)[2:10]

          conf = json.load(open("apps/desktop/src-tauri/tauri.conf.json"))
          shipped = key_id(conf["plugins"]["updater"]["pubkey"])
          signed = key_id(os.environ["SIG"])
          if shipped != signed:
              sys.exit(
                  f"::error::Signed with key {signed.hex()}, but the app trusts "
                  f"{shipped.hex()}. Every installed app would reject this update."
              )
          PY

          MANIFEST="$RUNNER_TEMP/latest.json"
          REPO="https://github.com/${{ github.repository }}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$REPO/releases/tag/$TAG" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$TARBALL.sig")" \
            --arg url "$REPO/releases/download/$TAG/$(basename "$TARBALL")" \
            '{$version, $notes, $pub_date,
              platforms: {"darwin-aarch64": {$signature, $url}}}' \
            > "$MANIFEST"

          echo "TARBALL=$TARBALL" >> $GITHUB_OUTPUT
          echo "MANIFEST=$MANIFEST" >> $GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          files: |
            ${{ steps.dmg.outputs.PATH }}
            ${{ steps.zip.outputs.PATH }}
            ${{ steps.updater.outputs.TARBALL }}
            ${{ steps.updater.outputs.MANIFEST }}
          generate_release_notes: true
          body: |
            Requires macOS 15 (Sequoia) or later on Apple Silicon.

            `brew install --cask raphaelmitas/tap/photopipe`, or download the
            DMG below.

      # Guarded so a release still succeeds when the token is absent; the tap
      # can always be updated by hand. `secrets` cannot be read in a step
      # `if:`, hence the env indirection.
      - name: Update the Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh workflow run update-cask.yml -R RaphaelMitas/homebrew-tap \
            -f cask_name=photopipe \
            -f release_tag="$TAG" \
            -f source_repo=RaphaelMitas/photopipe

  # Skipped without the store secrets, so a release still succeeds before they exist.
  mas:
    name: Build, sign, upload to the App Store
    needs: [check]
    if: (needs.check.outputs.is-release == 'true' || (needs.check.outputs.submit == 'true' && inputs.platform != 'ipad')) && needs.check.outputs.mas == 'true'
    runs-on: macos-15
    # Pinned so a repo-setting change cannot hand the fastlane gems a write token.
    permissions:
      contents: read
    outputs:
      build: ${{ steps.sign.outputs.build }}
    env:
      APP: apps/desktop/src-tauri/target/release/bundle/macos/Photopipe.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.ref }}
      # Tags cut before #193 lack setup-desktop and import-cert.sh, so take them from this workflow's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: |
            .github/actions
            scripts
      - uses: ./.ci/.github/actions/setup-desktop

      # A store build that could still phone GitHub for updates would be rejected.
      - name: Build the App Store flavour
        run: pnpm --filter desktop tauri build --bundles app --config src-tauri/mas.conf.json -- --no-default-features

      - name: Import signing certificates
        env:
          MAS_CERTIFICATE: ${{ secrets.MAS_CERTIFICATE }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          for required in MAS_CERTIFICATE MAS_CERTIFICATE_PASSWORD MAS_PROVISIONING_PROFILE APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not set. See docs/engineering.md for the six App Store secrets."
              exit 1
            fi
          done
          KEYCHAIN_PATH=$RUNNER_TEMP/mas.keychain-db
          CERTIFICATE="$MAS_CERTIFICATE" CERTIFICATE_PASSWORD="$MAS_CERTIFICATE_PASSWORD" \
            ./.ci/scripts/import-cert.sh "$KEYCHAIN_PATH" /usr/bin/codesign /usr/bin/productbuild

          APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
          # Installer certificates are not code-signing identities, so no
          # policy filter here. Newer certificates spell the name differently.
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
            | grep -e "3rd Party Mac Developer Installer" -e "Mac Installer Distribution" \
            | head -1 | awk -F'"' '{print $2}')
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::MAS_CERTIFICATE needs both an Apple Distribution and a Mac Installer Distribution identity."
            exit 1
          fi
          echo "APP_IDENTITY=$APP_IDENTITY" >> $GITHUB_ENV
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> $GITHUB_ENV

      - name: Sign
        id: sign
        env:
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
          # App Store Connect refuses a build number it has seen, so a retry of the same version needs a new one.
          BUILD="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$APP/Contents/Info.plist"
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          codesign --force --timestamp \
            --entitlements apps/desktop/src-tauri/entitlements.mas.plist \
            --sign "$APP_IDENTITY" "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Smoke test the bundle
        run: ./scripts/smoke-bundle.sh --mas "$APP"

      - name: Build the installer package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          PKG="$RUNNER_TEMP/Photopipe-$VERSION.pkg"
          productbuild --component "$APP" /Applications --sign "$INSTALLER_IDENTITY" "$PKG"
          echo "PKG=$PKG" >> $GITHUB_ENV
          # Nothing after this needs the identities, and the gems below should not have them.
          security delete-keychain "$RUNNER_TEMP/mas.keychain-db"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: photopipe-mas
          path: ${{ env.PKG }}

      - uses: ./.ci/.github/actions/store-upload
        with:
          platform: mac
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key: ${{ secrets.APP_STORE_CONNECT_KEY }}

  # Apple processes an upload for a while before it can be attached to a
  # version, and waiting is cheaper here than on a macOS runner.
  mas-review:
    name: Update the Mac listing, submit for review
    needs: [check, mas]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Not the tag: the listing and the lanes are not part of the binary, so a
      # retry picks up a fix to them. Full history, for What's New.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/store-review
        with:
          platform: mac
          version: ${{ needs.check.outputs.version }}
          tag: ${{ needs.check.outputs.tag }}
          build: ${{ needs.mas.outputs.build }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key: ${{ secrets.APP_STORE_CONNECT_KEY }}

  ipad:
    name: Build, sign, upload the iPad app
    needs: [check]
    if: (needs.check.outputs.is-release == 'true' || (needs.check.outputs.submit == 'true' && inputs.platform != 'mac')) && needs.check.outputs.mas == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.sign.outputs.build }}
    env:
      # The store takes iPad uploads only from Xcode 26 and its SDK; the image defaults to 16.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
      # Identical for both builds: the CLI hands it to cargo, and any change
      # makes the signing build recompile the app with the certificate around.
      TAURI_IOS_CONFIG: '{"build":{"beforeBuildCommand":null},"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}.${{ github.run_attempt }}"}}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.ref }}
      - uses: ./.github/actions/setup-desktop

      # Everything that runs third-party build code happens here, with no secrets.
      - name: Build the iPad app
        run: |
          pnpm --filter desktop build
          pnpm --filter desktop tauri ios build --export-method app-store-connect --no-sign \
            --config "$TAURI_IOS_CONFIG"

      # The Tauri CLI imports the certificate into a keychain of its own and
      # picks its codesigning identity, the Apple Distribution one.
      - name: Sign the iPad app
        id: sign
        env:
          IOS_CERTIFICATE: ${{ secrets.MAS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in IOS_MOBILE_PROVISION APPLE_DEVELOPMENT_TEAM; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not set. See docs/engineering.md for the App Store secrets."
              exit 1
            fi
          done
          # the unsigned ipa would otherwise be the one find picks up
          rm -rf apps/desktop/src-tauri/gen/apple/build/arm64
          pnpm --filter desktop tauri ios build --export-method app-store-connect \
            --config "$TAURI_IOS_CONFIG"
          IPA=$(find "$PWD/apps/desktop/src-tauri/gen/apple/build" -name "*.ipa" | head -1)
          [ -n "$IPA" ] || { echo "::error::The build produced no .ipa."; exit 1; }
          echo "IPA=$IPA" >> $GITHUB_ENV
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: photopipe-ipad
          path: ${{ env.IPA }}

      - uses: ./.github/actions/store-upload
        with:
          platform: ipad
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key: ${{ secrets.APP_STORE_CONNECT_KEY }}

  # deliver scopes the submission, the build and the pull of a waiting version
  # to one platform, so the iPad neither waits on the Mac nor reruns with it.
  ipad-review:
    name: Update the iPad listing, submit for review
    needs: [check, ipad]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/store-review
        with:
          platform: ipad
          version: ${{ needs.check.outputs.version }}
          tag: ${{ needs.check.outputs.tag }}
          build: ${{ needs.ipad.outputs.build }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key: ${{ secrets.APP_STORE_CONNECT_KEY }}
