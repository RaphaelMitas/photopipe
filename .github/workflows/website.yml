name: Website

on:
  push:
    branches: [main]
    paths: &website-sources
      - apps/web/**
      - packages/ui/**
      - tooling/**
      - brand/**
      - docs/screenshots/**
      - pnpm-lock.yaml
      - .github/workflows/website.yml
  pull_request:
    paths: *website-sources
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Export photopipe.net
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "web..."
      - run: pnpm --filter web build
      - name: Fail when the DMG link lost its version
        run: grep -q "/releases/download/v" apps/web/out/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website
          path: |
            apps/web/out
            apps/web/Caddyfile
            apps/web/Dockerfile

  publish:
    name: Publish the photopipe.net image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/raphaelmitas/photopipe-web
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: website
      - run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Serve the pages before anyone can pull them
        run: |
          docker run -d --rm --name smoke -p 8080:80 "$IMAGE:latest"
          for page in / /privacy /llms.txt; do
            curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null "http://127.0.0.1:8080$page"
          done
          docker stop smoke
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker push --all-tags "$IMAGE"
