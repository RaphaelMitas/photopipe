name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Lint, unit & e2e (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop exec playwright install --with-deps chromium
      - run: pnpm --filter desktop e2e

  native:
    name: Swift, Rust & app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: core/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('core/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Cache vendored exiftool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/src-tauri/resources/exiftool
          key: exiftool-${{ hashFiles('scripts/fetch-exiftool.sh') }}
      - name: Cache raw fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/raw
          key: fixtures-${{ hashFiles('fixtures/fetch.sh') }}
      - name: Fetch raw fixtures
        run: ./fixtures/fetch.sh
      - name: Install exiftool (XMP round-trip tests)
        run: brew install exiftool
      - name: Swift format lint
        working-directory: core
        run: swift format lint --strict --recursive .
      - name: Swift build & test
        working-directory: core
        run: |
          swift build
          swift test
      # tauri-build resolves externalBin and bundle.resources at compile
      # time, so a missing sidecar or exiftool fails every cargo command, not
      # just the bundle. Both are staged before the Rust steps.
      - name: Prepare bundle inputs
        run: ./scripts/prepare-bundle.sh
      - run: pnpm install --frozen-lockfile
      - name: Clippy (deny warnings)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo tests (sidecar integration against real core)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      # A real bundle, not --no-bundle: packaging is where the sidecar and
      # exiftool get staged, so a build that skips it cannot catch the
      # breakage that makes a shipped app useless.
      - name: Build the app bundle
        run: pnpm --filter desktop tauri build --bundles app
      - name: Smoke test the bundle
        run: ./scripts/smoke-bundle.sh
