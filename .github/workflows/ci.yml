name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Lint, unit & e2e (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop exec playwright install --with-deps chromium
      - run: pnpm --filter desktop e2e

  native:
    name: Swift, Rust & app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-desktop
        with:
          components: clippy
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: core/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('core/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Cache raw fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/raw
          key: fixtures-${{ hashFiles('fixtures/fetch.sh') }}
      - name: Fetch raw fixtures
        run: ./fixtures/fetch.sh
      - name: Swift format lint
        working-directory: core
        run: swift format lint --strict --recursive .
      # tauri-build resolves bundle.resources at compile time, so a missing
      # exiftool fails every cargo command, not just the bundle.
      - name: Vendor exiftool
        run: ./scripts/fetch-exiftool.sh
      - name: Swift test
        working-directory: core
        env:
          PHOTOPIPE_EXIFTOOL: ${{ github.workspace }}/apps/desktop/src-tauri/resources/exiftool/exiftool
        run: swift test
      - name: Clippy (deny warnings)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, store flavour (deny warnings)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      # The SDK the release builds the iPad app with, so CI compiles against what ships.
      - name: Clippy, iPad simulator (deny warnings)
        working-directory: apps/desktop/src-tauri
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo clippy --target aarch64-apple-ios-sim -- -D warnings
      # clippy compiles the Swift core for iOS; only the Xcode build links it into the app.
      # Tauri runs xcodebuild without DEVELOPER_DIR, so switch, then back for the Mac bundle.
      - name: Build the iPad app for the simulator
        run: |
          DEFAULT=$(xcode-select -p)
          sudo xcode-select -s /Applications/Xcode_26.2.app
          pnpm --filter desktop tauri ios build --debug --target aarch64-sim
          sudo xcode-select -s "$DEFAULT"
      - name: Cargo tests (against the linked core)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      # A real bundle, not --no-bundle: packaging is where exiftool gets
      # staged, so a build that skips it cannot catch the breakage that makes
      # a shipped app useless.
      - name: Build the app bundle
        run: pnpm --filter desktop tauri build --bundles app
      - name: Smoke test the bundle
        run: ./scripts/smoke-bundle.sh
