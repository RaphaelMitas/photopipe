<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Photopipe">
  <style>
    /* One shared 3.49s cycle for every element, so they can never drift apart. */
    .ppl-s1 { transform-origin: 39px 32px; animation: pp-sloop1 3.49s linear infinite }
    .ppl-s2 { transform-origin: 49px 32px; animation: pp-sloop2 3.49s linear infinite }
    .ppl-s3 { transform-origin: 57.4px 32px; animation: pp-sloop3 3.49s linear infinite }
    .ppl-b { transform-origin: 22px 32px; animation: pp-bloop 3.49s linear infinite }
    @keyframes pp-bloop {
      0%   { transform: scale(0.48); opacity: 0 }
      0%  { transform: scale(0.48); opacity: 0; animation-timing-function: cubic-bezier(.65,0,.35,1) }
      3.72%  { opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1) }
      12.66%  { transform: scale(1.01); animation-timing-function: cubic-bezier(.65,0,.35,1) }
      18.62%  { transform: scale(1); opacity: 1 }
      82.81%  { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1) }
      97.13%  { transform: scale(0.48); opacity: 0 }
      100% { transform: scale(0.48); opacity: 0 }
    }
    @keyframes pp-sloop1 {
      0%   { transform: translateX(-4px) scaleY(0.45); opacity: 0 }
      8.6%  { transform: translateX(-4px) scaleY(0.45); opacity: 0; animation-timing-function: cubic-bezier(.22,.9,.28,1) }
      38.68%  { transform: translateX(0) scaleY(1); opacity: 1 }
      77.65%  { transform: translateX(0) scaleY(1); opacity: 1; animation-timing-function: cubic-bezier(.22,.9,.28,1) }
      91.98%  { transform: translateX(6px) scaleY(1); opacity: 0 }
      100% { transform: translateX(-4px) scaleY(0.45); opacity: 0 }
    }
    @keyframes pp-sloop2 {
      0%   { transform: translateX(-7.2px) scaleY(0.45); opacity: 0 }
      10.89%  { transform: translateX(-7.2px) scaleY(0.45); opacity: 0; animation-timing-function: cubic-bezier(.22,.9,.28,1) }
      40.97%  { transform: translateX(0) scaleY(1); opacity: 0.6 }
      79.37%  { transform: translateX(0) scaleY(1); opacity: 0.6; animation-timing-function: cubic-bezier(.22,.9,.28,1) }
      93.7%  { transform: translateX(6px) scaleY(1); opacity: 0 }
      100% { transform: translateX(-7.2px) scaleY(0.45); opacity: 0 }
    }
    @keyframes pp-sloop3 {
      0%   { transform: translateX(-10.4px) scaleY(0.45); opacity: 0 }
      13.18%  { transform: translateX(-10.4px) scaleY(0.45); opacity: 0; animation-timing-function: cubic-bezier(.22,.9,.28,1) }
      43.27%  { transform: translateX(0) scaleY(1); opacity: 0.3 }
      81.09%  { transform: translateX(0) scaleY(1); opacity: 0.3; animation-timing-function: cubic-bezier(.22,.9,.28,1) }
      95.42%  { transform: translateX(6px) scaleY(1); opacity: 0 }
      100% { transform: translateX(-10.4px) scaleY(0.45); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .ppl-s1, .ppl-s2, .ppl-s3, .ppl-b { animation: none }
      .ppl-s2 { opacity: .6 } .ppl-s3 { opacity: .3 }
    }
  </style>
  <path stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M28 13H20a13 13 0 0 0-13 13v12a13 13 0 0 0 13 13h8"/>
  <rect class="ppl-b" fill="var(--pp-accent, #FF7A2F)" x="16" y="24" width="12" height="16" rx="6"/>
  <g class="ppl-s1"><path stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M39 16.0v32"/></g>
  <g class="ppl-s2"><path stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M49 22.0v20"/></g>
  <g class="ppl-s3"><path stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M57.4 27.0v10"/></g>
</svg>
