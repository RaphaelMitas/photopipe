allowBuilds:
  better-sqlite3: true
  sharp: true
  unrs-resolver: true

# These four are pinned by upstream and cannot be resolved by updating:
# next@16.2.12 (latest) pins postcss to exactly 8.4.31 and sharp to ^0.34.5,
# and the brace-expansion fix only lands in eslint 10, which is incompatible
# with the typescript-eslint 8 that eslint-config-next requires.
# Re-check on the next Next.js release and drop whatever it fixes.
auditConfig:
  ignoreGhsas:
    # postcss, via next. Build-time processing of our own CSS only.
    - GHSA-6g55-p6wh-862q
    - GHSA-r28c-9q8g-f849
    # sharp 0.34.5, via next's optional dep for next/image. This app never
    # uses next/image; its own thumbnailing runs on sharp 0.35.3, which is patched.
    - GHSA-f88m-g3jw-g9cj
    # brace-expansion, via eslint's minimatch. Lint tooling only, never shipped.
    - GHSA-mh99-v99m-4gvg
